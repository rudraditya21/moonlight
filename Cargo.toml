[package]
name = "moonlight"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
  "core/core",
  "core/repl",
  "modules/modules",
  "modules/dynlib_test",
  "storage/phf",
  "crypt/md4",
  "crypt/md5",
  "crypt/sha2_224",
  "crypt/sha1",
  "crypt/sha2_256",
  "crypt/sha2_384",
  "crypt/sha2_512",
  "network/net",
  "network/proto",
]
resolver = "2"

[dependencies]
corelib = { path = "core/core" }
repl = { path = "core/repl" }
modules = { path = "modules/modules" }
net = { path = "network/net" }
proto = { path = "network/proto" }
phf = { path = "storage/phf" }
